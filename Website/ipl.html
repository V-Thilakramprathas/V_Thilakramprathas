<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL</title>
    <link rel="icon" href="./iplTitle.png">
    <style>
        *{
            color: black;
            padding: 0;
            margin: 0;
        }
        .body{
            width: 100%;
            height: 100%;
            text-align: center;
            align-content: center;
            background:url("./background.jpg");
            background-size: 100% 100%;
        }
        .mainbody{
            padding: 5%;
            background-color: rgba(255, 255, 255, 0.80);
            box-shadow: 0 0 5px black,0 0 10px orange,0 0 15px orange,0 0 20px orange;
            width: 50%;
            height: 30%;
            margin: 10% auto;
            border-radius: 10px;
            align-content: center;
        }
        #winner{
            background-color: black;
            width: 200px;
            height: 200px;
            align-content: center;
            margin: 5% auto;
            border-radius: 100px;
            border: 2px solid white;
            display: none;
            box-shadow: 0 0 5px white, 0 0 10px white,0 0 15px white;
            animation: spinner 5s;

        }
        @keyframes spinner {
            100%{
                transform: rotateY(3600deg);
            }

        }
        select{
            background-color: rgba(0, 0, 0,0.6);
            padding: 5%;
            margin: 5% 0;
            color: orange;
            border: 1px solid black;
            border-radius: 5px;
        }
        option{
            color:orange;
        }
        button{
            margin-top: 15%;
            width: 100%;
            padding: 3%;
            background-color: rgba(255, 166, 0, 0.514);
            border-radius: 8px;
        }
        #h1{
            color:black;
            text-shadow: 0 0 5px white,0 0 10px white,0 0 15px white,0 0 20px wheat;
        }
        #hi{
            transition: color 1s;
        }
    </style>
</head>
<body>
    <div class="body">
        <div class="content">
            <div class="head">
                <h1 id="h1">IPL Winner Guess</h1>
            </div>
            <div class="mainBody" id="mainBody">
                <select id="team1">
                    <option value="CSK">Chennai Super Kings</option>
                    <option value="MI">Mumbai Indians</option>
                    <option value="RR">Rajasthan Royals</option>
                    <option value="KKR">Kolkata Knight Riders</option>
                    <option value="SH">Sunrisers Hyderabad</option>
                </select>
                <h3>VS</h3>
                <select id="team2">
                    <option value="PK">Punjab Kings</option>
                    <option value="RCB">Royal Challengers</option>
                    <option value="GT">Gujarat Titans</option>
                    <option value="DC">Delhi Capitals</option>
                    <option value="LSG">Lucknow Super Giants</option>
                </select>
                <button onclick="spin()">Spin</button>
            </div>
        </div>
        <br><br>
        <div id="winner">
        </div>
    </div>
    <script>
        function spin(){
            let team1=document.getElementById("team1").value;
            let team2=document.getElementById("team2").value;
            let t1=0;
            let t2=0;
            for(let i=0;i<1000;i++){
                let random=Math.floor((Math.random()*100)+1);
                //console.log(random);
                if(random<51){
                    t1++;
                }
                else{
                    t2++;
                }
            }
            console.log(t1+" "+t2);
            
            let winner=t1>t2?team1:team2;
            document.getElementById("mainBody").style.display="none";
            document.getElementById("winner").style.display="block";
            s=setInterval(disp,5000);
            document.getElementById("winner").innerHTML+="<h1 id='hi'>"+winner+"</h1>"

        }
        function disp(){
            document.getElementById("hi").style.color="orange";
        }
    </script>
</body>
</html>
